<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Advanced Chat UI with Real-time Ollama AI</title>

<!-- Markdown + Syntax Highlight libraries (loaded in head) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

<style>
:root{--bg:#fff;--text:#000;--border:#e0e0e0;--muted:#666;--msg-user:#f5f5f5;--msg-ai:#fff;--radius:12px;font-family:'Inter',sans-serif;}
body.dark{--bg:#121212;--text:#fff;--border:#333;--muted:#aaa;--msg-user:#1e1e1e;--msg-ai:#2a2a2a;--select-bg:#1e1e1e;--select-text:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;height:100vh;background:var(--bg);color:var(--text);transition:0.25s;}
.app{display:flex;width:100%;}

/* Sidebar */
.sidebar{width:20%;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;background:var(--bg);} 
.sidebar h2{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:10px;}
.theme-switch{position:relative;width:40px;height:20px;background:var(--border);border-radius:20px;cursor:pointer;transition:0.3s;}
.theme-switch::after{content:'';position:absolute;width:18px;height:18px;top:1px;left:1px;background:var(--text);border-radius:50%;transition:left 0.3s,background 0.3s;}
body.dark .theme-switch::after{left:21px;background:#fff;}
.new-chat{cursor:pointer;margin-bottom:10px;text-align:center;border:none;background:none;font-size:14px;padding:6px 0;color:var(--text);transition:color 0.3s;}
.chat-history{flex:1;overflow-y:auto;margin-top:6px;}
.chat-item{padding:10px;margin-bottom:6px;border-radius:var(--radius);color:var(--text);transition:0.3s;display:flex;justify-content:space-between;align-items:center;position:relative;cursor:pointer;}
.chat-item:hover{background:var(--msg-user);}
.menu-btn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);} 
.menu-dropdown{position:absolute;top:35px;right:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:none;flex-direction:column;min-width:140px;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:30;}
.menu-dropdown button{padding:8px 12px;border:none;background:none;text-align:left;width:100%;cursor:pointer;font-size:13px;color:var(--text);} 
.menu-dropdown button:hover{background: var(--msg-user);} 

/* Chat Panel */
.chat-panel{flex:1;display:flex;flex-direction:column;position:relative;}
.header{padding:16px;border-bottom:1px solid var(--border);font-weight:600;text-align:center;font-size:16px;color:var(--text);position:relative;}
.listening-indicator{position:absolute;top:18px;right:18px;width:12px;height:12px;border-radius:50%;background:green;animation:pulse 1s infinite;display:none;}
@keyframes pulse{0%{transform:scale(1);opacity:0.8;}50%{transform:scale(1.4);opacity:0.4;}100%{transform:scale(1);opacity:0.8;}}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
.message{max-width:70%;padding:12px 16px;border-radius:var(--radius);line-height:1.5;font-size:15px;color:var(--text);display:flex;flex-direction:column;position:relative;word-break:break-word;white-space:pre-wrap;}
.message.user{align-self:flex-end;background:var(--msg-user);} 
.message.ai{align-self:flex-start;background:var(--msg-ai);} 
.message .msg-row{display:flex;align-items:flex-start;gap:8px;}
.message .icon{font-size:18px;flex-shrink:0;margin-top:2px;}
.message .msg-content{flex:1;}
.message .timestamp{font-size:11px;color:var(--muted);margin-top:6px;align-self:flex-end;}
.message .exec-time{font-size:11px;color:var(--muted);margin-top:4px;align-self:flex-end;font-style:italic;}

/* Composer */
.composer{border-top:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px;}
.composer-row{display:flex;align-items:center;gap:8px;position:relative;}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius);padding:10px 80px 10px 36px;font-size:15px;font-family:inherit;background:var(--msg-ai);color:var(--text);transition:0.3s;min-height:40px;max-height:200px;overflow-y:auto;}
.icon-btn{cursor:pointer;font-size:18px;padding:6px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:var(--text);transition:0.2s;}
.icon-btn:hover{background: rgba(0,0,0,0.05);} 
body.dark .icon-btn:hover{background: rgba(255,255,255,0.06);} 
#docIcon{position:absolute;left:10px;top:50%;transform:translateY(-50%);} 
#micBtn{position:absolute;right:50px;top:50%;transform:translateY(-50%);} 
#sendBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);} 
.pending-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;} 
.pending-file{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--msg-user);display:flex;align-items:center;gap:8px;} 
.pending-file span.remove{cursor:pointer;color:#c33;margin-left:6px;}

/* Dropdowns & selectors */
.selectors{display:flex;gap:10px;font-size:13px;color: var(--muted);align-items:center;}
select{border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;font-size:13px;background:var(--bg);color:var(--text);transition:0.3s;} 
body.dark select{background:var(--select-bg);color:var(--select-text);border-color:var(--border);} 

/* Browser switch */
.browser-switch{position:relative;width:40px;height:20px;background:var(--border);border-radius:20px;transition:0.3s;cursor:pointer;} 
.browser-switch::after{content:'';position:absolute;width:18px;height:18px;top:1px;left:1px;background:var(--text);border-radius:50%;transition:left 0.3s,background 0.3s;} 
.browser-switch.active{background:#4caf50;} 
.browser-switch.active::after{left:21px;background:#fff;} 

/* scrollbar */
.chat-history::-webkit-scrollbar,.messages::-webkit-scrollbar{width:6px;} 
.chat-history::-webkit-scrollbar-thumb,.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;} 

/* small responsive */
@media (max-width:900px){
  .sidebar{display:none;}
  .messages{padding:12px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>Chat History <span class="theme-switch" id="themeSwitch"></span></h2>
    <button class="new-chat" id="newChat">＋ New Chat</button>
    <div class="chat-history" id="chatHistory"></div>
  </aside>

  <section class="chat-panel">
    <div class="header">
      Modern Chat Interface
      <div class="listening-indicator" id="listeningIndicator"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="selectors">
        <select id="modelSelect"><option>Loading...</option></select>
        <select id="modeSelect"><option>Chat</option><option>Code</option><option>Creative</option></select>

        <div style="display:flex;align-items:center;gap:6px;">
          <span title="Browser Access" style="font-size:16px;">🌐</span>
          <div class="browser-switch" id="browserSwitch"></div>
        </div>
      </div>

      <div class="composer-row">
        <span id="docIcon" class="icon-btn">＋</span>
        <textarea id="input" placeholder="Type a message..."></textarea>
        <span id="micBtn" class="icon-btn">🎙️</span>
        <span id="sendBtn" class="icon-btn">➡️</span>
      </div>

      <div id="pendingFiles" class="pending-files"></div>
    </div>
  </section>
</div>

<input type="file" id="docUpload" multiple style="display:none" />

<script>
/* -------------------------
   DOM references & state
   ------------------------- */
const body = document.body;
const themeSwitch = document.getElementById('themeSwitch');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const messages = document.getElementById('messages');
const chatHistory = document.getElementById('chatHistory');
const newChat = document.getElementById('newChat');
const docIcon = document.getElementById('docIcon');
const docUpload = document.getElementById('docUpload');
const pendingFilesContainer = document.getElementById('pendingFiles');
const listeningIndicator = document.getElementById('listeningIndicator');
const modelSelect = document.getElementById('modelSelect');
const modeSelect = document.getElementById('modeSelect');
const browserSwitch = document.getElementById('browserSwitch');

let chatCount = 1;
let pendingFiles = [];
let recognitionActive = false;
let recognition = null;
let speechTimer = null;
let speechBuffer = '';
let chatData = [];
let browserAccess = false;

/* --------------- helpers ----------------- */
function scrollToBottom(){ messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' }); }

function escapeHtml(s){
  if(!s) return '';
  return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

/* addMessage:
   - text: raw text (not HTML)
   - sender: 'user' or 'ai'
   - files: optional file list to display
   - store: whether to store in chatData/localStorage
   - renderMarkdown: if true, render the text as markdown (used for restoring history)
*/
function addMessage(text, sender='user', files=[], store=true, renderMarkdown=false){
  const msg = document.createElement('div');
  msg.className = 'message ' + sender;

  const row = document.createElement('div'); row.className = 'msg-row';
  const icon = document.createElement('span'); icon.className = 'icon'; icon.textContent = sender==='ai' ? '🤖' : '👤';
  const content = document.createElement('div'); content.className = 'msg-content';

  if(renderMarkdown){
    try{ content.innerHTML = marked.parse(text || ''); }
    catch(e){ content.textContent = text || ''; }
    content.querySelectorAll('pre code').forEach(block => { try { hljs.highlightElement(block); } catch(e){} });
  } else {
    // default: escape HTML, keep newlines
    content.innerHTML = escapeHtml(text || '').replace(/\n/g,'<br>');
  }

  if(files && files.length){
    const fileList = document.createElement('div'); fileList.style.marginTop = '6px';
    files.forEach(f => {
      const fDiv = document.createElement('div');
      fDiv.textContent = '📄 ' + (f.name || f);
      fileList.appendChild(fDiv);
    });
    content.appendChild(fileList);
  }

  row.appendChild(icon); row.appendChild(content);
  msg.appendChild(row);

  // If AI message, show exec-time placeholder
  if(sender === 'ai'){
    const execSpan = document.createElement('span'); execSpan.className = 'exec-time'; execSpan.textContent = 'Execution: ...';
    msg.appendChild(execSpan);
  }

  // timestamp
  const ts = document.createElement('span'); ts.className = 'timestamp';
  ts.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  msg.appendChild(ts);

  messages.appendChild(msg);
  scrollToBottom();

  if(store){
    chatData.push({ sender, text, files: files.map(f => ({ name: f.name ? f.name : f })) });
    saveHistory();
  }

  return msg;
}

/* ---------------- pending files UI ---------------- */
function renderPendingFiles(){
  pendingFilesContainer.innerHTML = '';
  pendingFiles.forEach((f, i) => {
    const fileDiv = document.createElement('div'); fileDiv.className = 'pending-file';
    fileDiv.innerHTML = `📄 ${escapeHtml(f.name)} <span class="remove">❌</span>`;
    fileDiv.querySelector('.remove').addEventListener('click', () => {
      pendingFiles.splice(i,1);
      renderPendingFiles();
    });
    pendingFilesContainer.appendChild(fileDiv);
  });
}

/* ----------------- localStorage history ----------------- */
function saveHistory(){ localStorage.setItem('chatData', JSON.stringify(chatData)); }

function loadHistory(){
  try{
    const data = JSON.parse(localStorage.getItem('chatData') || '[]');
    chatData = data || [];
    messages.innerHTML = '';
    chatData.forEach(m => {
      // render ai messages as markdown to keep formatting
      addMessage(m.text, m.sender, m.files ? m.files.map(x=>x.name) : [], false, m.sender === 'ai');
    });
  } catch(e){
    console.error('loadHistory failed', e);
  }
}

/* --------------- Chat history sidebar items ---------------- */
function addToHistory(title){
  const item = document.createElement('div'); item.className = 'chat-item';
  const titleSpan = document.createElement('span'); titleSpan.textContent = title;
  const menuBtn = document.createElement('button'); menuBtn.className = 'menu-btn'; menuBtn.textContent = '⋮';
  const dropdown = document.createElement('div'); dropdown.className = 'menu-dropdown';
  dropdown.innerHTML = `<button class="rename">Rename</button><button class="delete">Delete</button><button class="archive">Archive</button><button class="share">Share</button>`;

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.menu-dropdown').forEach(d => { if(d !== dropdown) d.style.display = 'none'; });
    dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
  });

  dropdown.querySelector('.delete').addEventListener('click', () => item.remove());
  dropdown.querySelector('.rename').addEventListener('click', () => {
    const newName = prompt('Enter new name:', titleSpan.textContent);
    if(newName) titleSpan.textContent = newName;
    dropdown.style.display = 'none';
  });
  dropdown.querySelector('.archive').addEventListener('click', () => { alert('Chat archived!'); dropdown.style.display = 'none'; });
  dropdown.querySelector('.share').addEventListener('click', () => { navigator.clipboard?.writeText(location.href); alert('Share link copied!'); dropdown.style.display = 'none'; });

  item.appendChild(titleSpan); item.appendChild(menuBtn); item.appendChild(dropdown);
  chatHistory.prepend(item);
}

/* hide any open dropdown when clicking outside */
document.addEventListener('click', () => {
  document.querySelectorAll('.menu-dropdown').forEach(d => d.style.display = 'none');
});

/* ---------------- file selection ---------------- */
docIcon.addEventListener('click', ()=> docUpload.click());
docUpload.addEventListener('change', (event) => {
  if(event.target.files && event.target.files.length){
    pendingFiles = Array.from(event.target.files);
    renderPendingFiles();
    docUpload.value = '';
  }
});

/* ----------------- Voice recognition ----------------- */
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    let interim = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal){
        speechBuffer += (transcript + ' ');
      } else {
        interim += transcript + ' ';
      }
    }
    input.value = interim || speechBuffer;
    if((interim.trim() !== '') || (speechBuffer.trim() !== '')){
      clearTimeout(speechTimer);
      speechTimer = setTimeout(()=>{ if(input.value.trim() !== '') sendBtn.click(); }, 1200);
    }
  };

  recognition.onerror = (e) => {
    console.error('Speech error', e);
    try{ recognition.stop(); } catch(err){}
    recognitionActive = false; micBtn.textContent = '🎙️'; listeningIndicator.style.display = 'none';
  };
}

micBtn.addEventListener('click', ()=>{
  if(!recognition) return alert('Voice recognition not supported in this browser.');
  if(!recognitionActive){
    try{ recognition.start(); recognitionActive = true; micBtn.textContent = '⏸️'; listeningIndicator.style.display = 'block'; } catch(e){ console.warn(e); }
  } else {
    try{ recognition.stop(); } catch(e){ console.warn(e); }
    recognitionActive = false; micBtn.textContent = '🎙️'; listeningIndicator.style.display = 'none';
  }
});

/* -------------- new chat ----------------- */
newChat.addEventListener('click', ()=>{
  chatCount++;
  addToHistory('Chat ' + chatCount);
  messages.innerHTML = '';
  chatData = [];
  saveHistory();
});

/* ----------------- theme & browser switch ---------------- */
themeSwitch.addEventListener('click', ()=> body.classList.toggle('dark'));
browserSwitch.addEventListener('click', ()=> { browserAccess = !browserAccess; browserSwitch.classList.toggle('active', browserAccess); });

/* --------------- load models dynamically -------------- */
async function loadModels(){
  try {
    modelSelect.innerHTML = '<option>Loading...</option>';
    const res = await fetch('/models');
    if(!res.ok) throw new Error('Failed to load models');
    const data = await res.json();
    modelSelect.innerHTML = '<option value="auto">Auto</option>';
    if(Array.isArray(data.models)){
      data.models.forEach(m => {
        const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
        modelSelect.appendChild(opt);
      });
    } else if(Array.isArray(data)){
      data.forEach(m => {
        const opt = document.createElement('option'); opt.value = m.name || m; opt.textContent = m.name || m;
        modelSelect.appendChild(opt);
      });
    } else {
      modelSelect.innerHTML += '<option>No models found</option>';
    }
  } catch(e){
    console.error('loadModels error', e);
    modelSelect.innerHTML = '<option>Error loading</option>';
  }
}
loadModels();

/* ----------------- streaming send logic ----------------
   Sends FormData (text + mode + model + browserAccess + files)
   Reads streaming response and updates message in real-time,
   parses markdown via marked.js and highlights code via hljs.
   ------------------------------------------------------ */
sendBtn.addEventListener('click', async ()=>{
  const text = input.value.trim();
  const mode = modeSelect.value;
  const model = modelSelect.value || 'auto';

  if(!text && pendingFiles.length === 0) return;

  // Save the user message (shows attached file names visually)
  addMessage(text, 'user', pendingFiles);

  // prepare input UI cleanup
  input.value = '';
  speechBuffer = '';
  renderPendingFiles();

  // create placeholder AI message
  const aiMsgDiv = addMessage('', 'ai', []);
  const execSpan = aiMsgDiv.querySelector('.exec-time');
  const contentDiv = aiMsgDiv.querySelector('.msg-content');
  const startTime = performance.now();

  try {
    // Build FormData with text + metadata + attached files
    const fd = new FormData();
    fd.append('text', text);
    fd.append('mode', mode);
    fd.append('model', model);
    fd.append('browserAccess', browserAccess ? 'true' : 'false');

    // Append files
    pendingFiles.forEach((file, idx) => {
      // Use same field name for multiple files - backend handles request.files.getlist('files')
      fd.append('files', file, file.name);
    });

    // POST to /stream_chat using fetch; backend should stream textual chunks
    const resp = await fetch('/stream_chat', { method: 'POST', body: fd });

    if(!resp.ok){
      throw new Error('Network response was not ok: ' + resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let aiText = '';

    // Stream read loop
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      // decode chunk
      aiText += decoder.decode(value, { stream: true });

      // Render partial markdown to HTML, then highlight code blocks
      try {
        contentDiv.innerHTML = marked.parse(aiText);
        contentDiv.querySelectorAll('pre code').forEach((block) => {
          try { hljs.highlightElement(block); } catch(e){}
        });
      } catch(e){
        // if parsing fails for partial markdown, fallback to plain escaped text
        contentDiv.innerHTML = escapeHtml(aiText).replace(/\n/g,'<br>');
      }

      scrollToBottom();
    }

    // stream finished - finalize
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
    execSpan.textContent = `Execution: ${elapsed}s`;

    // store AI message (raw markdown) for persistence
    chatData.push({ sender: 'ai', text: aiText, files: [] });
    saveHistory();

  } catch(err){
    console.error('streaming error', err);
    contentDiv.textContent = 'Error fetching response';
    execSpan.textContent = 'Execution: 0s';
  } finally {
    // clear pending files after sending
    pendingFiles = [];
    renderPendingFiles();
  }
});

/* ------------- input autosize & enter-to-send ------------- */
input.addEventListener('input', ()=> { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});

/* init load */
loadHistory();

</script>
</body>
</html>
